<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ed"><title>Pawgress · 猫咪训练</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24332e;background:#f7f4ed}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:22px 18px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.sub{color:#738079;font-size:12px}.card{background:#fff;border:1px solid #e6e8df;border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 16px #24332e08}h1{font-size:26px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 7px}p{line-height:1.6;color:#58645e;font-size:14px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#64866c;font-weight:800}.muted{color:#77827a;font-size:13px}.pill{background:#e9f1e8;border-radius:30px;padding:7px 11px;font-size:12px;color:#356047}.progress{height:9px;background:#e7ede6;border-radius:20px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#78a184;transition:width .2s}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #e3e6de;display:flex;justify-content:center;padding:9px 5px max(10px,env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(10px)}.tabs button{max-width:130px;flex:1;background:none;color:#7a877f;font-size:11px;padding:7px 1px}.tabs button.active{color:#2f6a49;font-weight:800}button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:#e9eee8;color:#274a36;font-weight:650}button.primary{background:#315e46;color:white}button:disabled{opacity:.4}button.small{font-size:12px;padding:8px 11px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}.day{padding:10px 1px;text-align:center;border:1px solid #dce3d9;background:white;border-radius:12px;font-size:12px}.day.selected{background:#315e46;color:white}.day span{display:block;font-size:19px;font-weight:750}.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #edf0eb}.task input{accent-color:#47785b;width:20px;height:20px;flex-shrink:0}.task label{flex:1;font-size:14px;line-height:1.5}.task small{display:block;color:#78867c;margin-top:4px}.field{margin:15px 0}label.caption{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input[type=date],input[type=number],select,textarea{font:inherit;width:100%;border:1px solid #dbe3d9;border-radius:11px;padding:12px;background:#fff;color:#24332e}textarea{min-height:85px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f2f5ef;padding:13px;border-radius:13px}.stat strong{display:block;font-size:23px}.stat small{color:#78867c}.entry{border-bottom:1px solid #edf0eb;padding:12px 0}.entry:last-child{border:0}.chart{display:flex;align-items:end;gap:7px;height:170px;border-bottom:1px solid #b9c5ba;padding:0 4px 0}.barwrap{flex:1;text-align:center;font-size:10px;color:#77857b}.bar{background:#84aa8d;border-radius:5px 5px 0 0;min-height:2px;margin-bottom:7px}.notice{background:#fff4df;border-radius:13px;padding:12px;font-size:13px;color:#7a6035;line-height:1.5}.hidden{display:none}a{color:#356b4c}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#243b2c;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:20;font-size:13px;white-space:nowrap}@media(max-width:370px){main{padding-left:12px;padding-right:12px}}
</style></head><body><main><header><div><div class="brand">🐾 Pawgress</div><div class="sub">A little progress, every paw.</div></div><span class="pill">信任优先</span></header><section id="home"></section><section id="diary" class="hidden"></section><section id="insights" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">⌂<br>训练</button><button data-tab="diary">✎<br>记录</button><button data-tab="insights">▥<br>趋势</button><button data-tab="settings">⚙<br>设置</button></nav><div id="toast"></div><script>
const PLAN=[
['建立 Yes! 信号','轻声说 Yes!，立即给一颗零食，重复5–8次。','在不会触发逃跑的距离出现，扔零食后退开，3–5次。'],
['巩固声音与安全感','练习 Yes!→零食；它主动看向你时标记并奖励。','从安全距离侧身迈小步，扔零食后退回。'],
['奖励自愿靠近','坐下，等它自愿接近；说 Yes! 并奖励，不伸手抓。','继续人靠近→零食→人离开。'],
['初步建立 Come','仅在它已经准备走向你时说 Come，靠近后 Yes!＋奖励。','继续安全距离训练，不用 Come 强迫接近。'],
['建立猫垫行为','它自愿踏上固定猫垫时说 Yes! 并奖励。','保持安全距离，记录你走动时的反应。'],
['引入 Place','它已经会走向猫垫时，在动作开始前说 Place，踏上后标记奖励。','轻微走近→奖励→退开，始终低于恐惧阈值。'],
['巩固与评估','分别短练 Yes!、Come、Place；没有反应不要重复喊。','进行最容易成功的靠近训练，记录安全距离。']];
const KEY='pawgress_v1';const fresh=()=>({start:localDate(),checks:Array.from({length:7},()=>[false,false,false]),logs:[],name:'公猫'});function localDate(d=new Date()){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}let selected=0,tab='home';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}function todayIndex(){return Math.min(6,Math.max(0,Math.floor((new Date(localDate()+'T12:00:00')-new Date(state.start+'T12:00:00'))/86400000)))}function render(){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));renderHome();renderDiary();renderInsights();renderSettings()}
function renderHome(){let done=state.checks.flat().filter(Boolean).length,d=PLAN[selected];document.querySelector('#home').innerHTML=`<div class="eyebrow">YOUR TRAINING JOURNEY</div><h1>慢慢来，信任会生长 🌱</h1><p>今天先让它觉得安全，再练习行为。任何时候逃跑，都回到更容易的距离。</p><div class="card"><div class="row"><b>第一周训练</b><span class="pill">${done}/21 完成</span></div><div class="progress"><div style="width:${done/21*100}%"></div></div><div class="days">${PLAN.map((_,i)=>`<button class="day ${selected===i?'selected':''}" onclick="selectDay(${i})">Day<span>${i+1}</span>${state.checks[i].every(Boolean)?'✓':'·'}</button>`).join('')}</div><div class="eyebrow">DAY ${selected+1}</div><h2>${d[0]}</h2>${['上午 · 声音与指令','傍晚 · 安全感训练','当天行为已记录'].map((t,i)=>`<div class="task"><input type="checkbox" id="c${i}" ${state.checks[selected][i]?'checked':''} onchange="check(${selected},${i},this.checked)"><label for="c${i}"><b>${t}</b><small>${i===0?d[1]:i===1?d[2]:'在「记录」页填写一次观察后勾选'}</small></label></div>`).join('')}<div class="row" style="margin-top:16px"><button class="small" ${selected===0?'disabled':''} onclick="selectDay(${selected-1})">← 前一天</button><button class="small primary" ${selected===6?'disabled':''} onclick="selectDay(${selected+1})">下一天 →</button></div></div><div class="card"><h2>日常处理原则</h2><p>🐈 <b>抢食：</b>提前分房间喂食，不训斥。<br>🧩 <b>破坏物品：</b>安全管理环境，引导到猫垫或玩具。<br>💚 <b>主动靠近：</b>尊重选择，标记并奖励，不强迫抚摸。</p></div><div class="notice">提示：7天是参考顺序，不是必须完成的进度。如果仍然逃跑，就重复前面的安全距离练习。</div>`}
function renderDiary(){let logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#diary').innerHTML=`<div class="eyebrow">BEHAVIOUR DIARY</div><h1>今天它感觉怎么样？</h1><p>只记录自然观察到的安全距离，不要故意逼近直到它逃跑。</p><form id="logform" class="card"><div class="field"><label class="caption">日期</label><input name="date" type="date" value="${localDate()}" required></div><div class="grid2"><div class="field"><label class="caption">放松距离（米）</label><input name="distance" type="number" min="0" max="100" step="0.5" placeholder="例如 4"></div><div class="field"><label class="caption">当时反应</label><select name="reaction"><option value="relaxed">放松</option><option value="alert">警觉未逃跑</option><option value="hide">逃跑或躲藏</option></select></div></div><div class="grid2"><div class="field"><label class="caption">主动靠近次数</label><input name="approach" type="number" min="0" max="100" value="0"></div><div class="field"><label class="caption">不希望的行为次数</label><input name="incidents" type="number" min="0" max="100" value="0"></div></div><div class="field"><label class="caption">观察备注</label><textarea name="notes" maxlength="1500" placeholder="例如：今天我站起来，它没有立即跑走"></textarea></div><button class="primary" type="submit" style="width:100%">保存今天的观察</button></form><div class="card"><h2>历史记录 (${logs.length})</h2>${logs.length?logs.slice(0,20).map(l=>`<div class="entry"><div class="row"><b>${esc(l.date)}</b><button class="small" onclick="deleteLog('${esc(l.id)}')">删除</button></div><div class="muted">${{relaxed:'放松',alert:'警觉',hide:'逃跑/躲藏'}[l.reaction]} · 安全距离 ${l.distance===null?'未填':l.distance+'m'} · 主动靠近 ${l.approach} 次 · 事件 ${l.incidents} 次</div><p>${esc(l.notes)}</p></div>`).join(''):'<p>还没有记录。第一次观察从今天开始。</p>'}</div>`;document.querySelector('#logform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),dist=f.get('distance');state.logs.push({id:String(Date.now())+Math.random().toString(36).slice(2),date:f.get('date'),distance:dist===''?null:Number(dist),reaction:f.get('reaction'),approach:Number(f.get('approach')),incidents:Number(f.get('incidents')),notes:f.get('notes')});save();render();toast('记录已保存 ✓')}}
function renderInsights(){let logs=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date)), recent=logs.slice(-14), avg=recent.filter(x=>x.distance!==null), av=avg.length?(avg.reduce((a,b)=>a+b.distance,0)/avg.length).toFixed(1):'—', calm=recent.filter(x=>x.reaction==='relaxed').length;let chart=recent.length?`<div class="chart">${recent.map(l=>`<div class="barwrap"><div class="bar" style="height:${l.distance===null?2:Math.max(3,Math.min(100,l.distance/Math.max(1,...recent.map(x=>x.distance||0))*100))}%"></div>${esc(l.date.slice(5))}</div>`).join('')}</div><p class="muted">图表：放松距离（米）。距离变小且保持放松，可能表示进步；单日变化不代表趋势。</p>`:'<p>保存几天的观察后，这里会显示趋势图。</p>';document.querySelector('#insights').innerHTML=`<div class="eyebrow">PROGRESS & PATTERNS</div><h1>每一点进步都值得看见</h1><div class="grid2"><div class="stat"><strong>${logs.length}</strong><small>观察记录</small></div><div class="stat"><strong>${state.checks.flat().filter(Boolean).length}/21</strong><small>训练打卡</small></div><div class="stat"><strong>${av}${av==='—'?'':'m'}</strong><small>最近放松距离均值</small></div><div class="stat"><strong>${calm}</strong><small>最近放松记录</small></div></div><div class="card"><h2>最近14条距离趋势</h2>${chart}</div><div class="card"><h2>训练建议</h2><p>${recent.length===0?'先记录几次日常行为，观察它能接受的距离。':recent.at(-1).reaction==='hide'?'最近一次出现逃跑：下一次请增加距离、降低难度，不要追赶。':recent.at(-1).reaction==='alert'?'最近一次有警觉：先维持或增加距离，直到它能放松。':'最近一次反应放松：保持当前强度，连续多次稳定后再尝试很小的变化。'}</p></div>`}
function renderSettings(){document.querySelector('#settings').innerHTML=`<div class="eyebrow">SETTINGS & DATA</div><h1>你的 Pawgress</h1><div class="card"><div class="field"><label class="caption">猫咪昵称</label><input id="catname" value="${esc(state.name)}" maxlength="30"></div><div class="field"><label class="caption">训练开始日期</label><input id="startdate" type="date" value="${esc(state.start)}"></div><button onclick="saveSettings()">保存设置</button></div><div class="card"><h2>备份与导出</h2><p>数据只保存在当前浏览器的本地存储中。清除网站数据、更换设备或使用隐私模式可能导致丢失。建议每周导出备份。</p><div class="row" style="flex-wrap:wrap"><button onclick="exportJSON()">导出完整 JSON</button><button onclick="exportCSV()">导出观察 CSV</button></div><div class="field"><label class="caption">从 JSON 备份恢复</label><input id="restore" type="file" accept=".json,application/json"></div><button onclick="restoreJSON()">导入备份（覆盖当前数据）</button></div><div class="card"><h2>提醒设置</h2><p>此离线基础版不能在网页关闭时可靠发送定时推送。建议使用 iPhone「提醒事项」设置每天上午和傍晚的重复提醒，并将此网页添加到主屏幕。</p><button onclick="downloadICS()">下载每日提醒日历文件</button><p class="muted">日历提醒默认为每天 09:00 和 19:00，可在日历中修改。</p></div><div class="card"><h2>训练原则</h2><p>不吼叫、不追逐、不强迫触碰；分开喂食；先确保安全，再训练替代行为。持续强烈恐惧或突然行为变化时咨询兽医。</p></div>`}
window.selectDay=i=>{selected=i;render()};window.check=(d,i,v)=>{state.checks[d][i]=v;save();renderHome()};window.deleteLog=id=>{if(confirm('删除这条记录？')){state.logs=state.logs.filter(l=>l.id!==id);save();render()}};window.saveSettings=()=>{state.name=document.querySelector('#catname').value;state.start=document.querySelector('#startdate').value;save();render();toast('设置已保存')};function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}window.exportJSON=()=>download('pawgress-backup-'+localDate()+'.json',JSON.stringify(state,null,2),'application/json');window.exportCSV=()=>{let cols=['date','distance','reaction','approach','incidents','notes'];let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('pawgress-observations-'+localDate()+'.csv','\ufeff'+cols.join(',')+'\r\n'+state.logs.map(l=>cols.map(k=>q(l[k])).join(',')).join('\r\n'),'text/csv;charset=utf-8')};window.restoreJSON=async()=>{let file=document.querySelector('#restore').files[0];if(!file)return toast('请先选择 JSON 文件');try{let d=JSON.parse(await file.text());if(!Array.isArray(d.logs)||!Array.isArray(d.checks)||d.checks.length!==7||!d.checks.every(x=>Array.isArray(x)&&x.length===3)||typeof d.start!=='string')throw Error();if(!confirm('确定覆盖当前数据？请先导出备份。'))return;state={...fresh(),...d};save();render();toast('恢复成功')}catch{toast('备份格式不正确')}};window.downloadICS=()=>{let stamp='20261024T000000Z',events=[['090000','Pawgress 上午训练'],['190000','Pawgress 傍晚训练']];let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pawgress//Training//ZH'];for(let [time,title] of events){lines.push('BEGIN:VEVENT','UID:pawgress-'+time+'@local','DTSTAMP:'+stamp,'DTSTART:'+state.start.replaceAll('-','')+'T'+time,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:'+title,'DESCRIPTION:打开 Pawgress 完成每日训练和记录。','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');download('pawgress-reminders.ics',lines.join('\r\n'),'text/calendar')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});selected=todayIndex();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
